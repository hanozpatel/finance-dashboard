# Builds the read-only live preview and publishes it to GitHub Pages.
#
# The preview has no server: backend/scripts/build_static_demo.py seeds a
# throwaway database with made-up data and records every response the UI can
# ask for, and the static build answers from that file.
#
# It runs daily as well as on push because the demo data is generated relative
# to today. Rebuilding keeps the preview's "this month" lined up with the
# visitor's calendar instead of drifting further behind every day.
name: Live preview

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Snapshot the demo data
        run: python backend/scripts/build_static_demo.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build the static preview
        run: npx vite build
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
      # Pages serves 404.html for unknown paths, which is what makes a deep
      # link like /budget load the app instead of a GitHub error page.
      - run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
