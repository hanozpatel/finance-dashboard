# Builds the web version of the app and publishes it to GitHub Pages.
#
# The web version is the whole app, Python backend included, running inside the
# visitor's browser with Pyodide (see backend/browser_bridge.py). Pages only
# serves files: the frontend, plus the backend's source zipped by
# backend/scripts/build_browser_bundle.py. There is no server, and each
# visitor's data stays in their own browser.
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the backend for the browser
        run: python3 backend/scripts/build_browser_bundle.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build the web app
        run: npx tsc --noEmit && npx vite build
        working-directory: frontend
        env:
          VITE_BROWSER_APP: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
      # Pages serves 404.html for unknown paths, which is what makes a deep
      # link like /budget load the app instead of a GitHub error page.
      - run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
